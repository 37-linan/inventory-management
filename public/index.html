<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>库存管理工作台</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/lib/quagga.min.js"></script>
  <script src="/js/modules/api.js"></script>
  <script src="/js/modules/chart.js"></script>
  <script src="/js/modules/barcode.js"></script>
  <script src="/js/modules/camera.js"></script>
  <script src="/js/modules/config.js"></script>
  <script src="/js/modules/products.js"></script>
  <script src="/js/modules/transactions.js"></script>
  <script src="/js/modules/inventory.js"></script>
  <script src="/js/app.js"></script>
</head>
<body>
  <div id="app">
    <!-- 移动端菜单按钮（固定在左上角） -->
    <button id="mobile-menu-btn" onclick="toggleSidebar()">☰</button>

    <!-- 左侧导航 -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="app-logo">📦</div>
        <h2>库存管理</h2>
        <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-group">
          <div class="nav-group-title">主系统</div>
          <a class="nav-item active" data-page="main-products" onclick="navigateTo('main-products')">
            <span class="nav-icon">📋</span>
            <span class="nav-text">主产品信息表</span>
          </a>
          <a class="nav-item" data-page="main-ledger" onclick="navigateTo('main-ledger')">
            <span class="nav-icon">📊</span>
            <span class="nav-text">主出入库台账</span>
          </a>
          <a class="nav-item" data-page="main-inventory" onclick="navigateTo('main-inventory')">
            <span class="nav-icon">📈</span>
            <span class="nav-text">主库存看板</span>
          </a>
        </div>
        <div class="nav-divider"></div>
        <div class="nav-group" id="douyin-nav-group" style="display:none;">
          <div class="nav-group-title">抖音刷券系统 <span style="font-size:11px;color:rgba(255,255,255,0.4);">（未启用）</span></div>
          <a class="nav-item" data-page="douyin-products" onclick="navigateTo('douyin-products')">
            <span class="nav-icon">🎫</span>
            <span class="nav-text">抖音刷券产品信息表</span>
          </a>
          <a class="nav-item" data-page="douyin-ledger" onclick="navigateTo('douyin-ledger')">
            <span class="nav-icon">📊</span>
            <span class="nav-text">抖音刷券出入库登记</span>
          </a>
          <a class="nav-item" data-page="douyin-inventory" onclick="navigateTo('douyin-inventory')">
            <span class="nav-icon">📈</span>
            <span class="nav-text">抖音刷券库存看板</span>
          </a>
        </div>
      </nav>
    </aside>

    <!-- 遮罩层（移动端） -->
    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- 主内容区 -->
    <main id="main-content">
      <div class="page-container" id="page-main-products"></div>
      <div class="page-container" id="page-main-ledger" style="display:none"></div>
      <div class="page-container" id="page-main-inventory" style="display:none"></div>
      <div class="page-container" id="page-douyin-products" style="display:none"></div>
      <div class="page-container" id="page-douyin-ledger" style="display:none"></div>
      <div class="page-container" id="page-douyin-inventory" style="display:none"></div>
    </main>
  </div>

  <!-- 模态框容器 -->
  <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-container" id="modal-container">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast提示 -->
  <div id="toast" class="toast"></div>
</body>
</html>
