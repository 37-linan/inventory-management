<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>库存管理工作台</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/lib/quagga.min.js"></script>
  <script src="/js/modules/api.js"></script>
  <script src="/js/modules/chart.js"></script>
  <script src="/js/modules/barcode.js"></script>
  <script src="/js/modules/camera.js"></script>
  <script src="/js/modules/config.js"></script>
  <script src="/js/modules/products.js"></script>
  <script src="/js/modules/transactions.js"></script>
  <script src="/js/modules/inventory.js"></script>
  <script src="/js/app.js"></script>
</head>
<body>
  <!-- 访问密码登录层 -->
  <div id="login-overlay" style="display:none;">
    <div class="login-box">
      <div class="login-logo">📦</div>
      <h2>库存管理工作台</h2>
      <p class="login-tip">请输入访问密码</p>
      <input type="password" id="login-password" placeholder="访问密码" autocomplete="off" />
      <button class="login-btn" onclick="checkLogin()">进入系统</button>
      <p id="login-error" class="login-error" style="display:none;">密码错误，请重新输入</p>
    </div>
  </div>

  <div id="app">
    <!-- 移动端菜单按钮（固定在左上角） -->
    <button id="mobile-menu-btn" onclick="toggleSidebar()">☰</button>

    <!-- 移动端返回首页按钮 -->
    <button id="mobile-back-btn" onclick="navigateTo('home')" style="display:none;">🏠</button>

    <!-- 左侧导航 -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="app-logo">📦</div>
        <h2>库存管理</h2>
        <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-group">
          <div class="nav-group-title">主系统</div>
          <a class="nav-item active" data-page="main-products" onclick="navigateTo('main-products')">
            <span class="nav-icon">📋</span>
            <span class="nav-text">主产品信息表</span>
          </a>
          <a class="nav-item" data-page="main-ledger" onclick="navigateTo('main-ledger')">
            <span class="nav-icon">📊</span>
            <span class="nav-text">主出入库台账</span>
          </a>
          <a class="nav-item" data-page="main-inventory" onclick="navigateTo('main-inventory')">
            <span class="nav-icon">📈</span>
            <span class="nav-text">主库存看板</span>
          </a>
        </div>
      </nav>
    </aside>

    <!-- 遮罩层（移动端） -->
    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- 主内容区 -->
    <main id="main-content">
      <div class="page-container" id="page-home" style="display:none"></div>
      <div class="page-container" id="page-main-products"></div>
      <div class="page-container" id="page-main-ledger" style="display:none"></div>
      <div class="page-container" id="page-main-inventory" style="display:none"></div>
    </main>
  </div>

  <!-- 模态框容器 -->
  <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-container" id="modal-container">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast提示 -->
  <div id="toast" class="toast"></div>

  <!-- 底部备案号 -->
  <footer style="text-align:center;padding:14px 12px;font-size:12px;color:var(--text-light, #999);background:var(--bg, #f8f9fa);border-top:1px solid var(--border, #e0e0e0);line-height:1.7;">
    <div>
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" style="color:var(--text-secondary, #666);text-decoration:none;margin:0 6px;">粤ICP备2026122814号-1</a>
    </div>
    <div>
      <img src="/icons/gongan.png" alt="公安备案" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;" onerror="this.style.display='none'" />
      <a href="https://beian.mps.gov.cn/" target="_blank" rel="noopener" style="color:var(--text-secondary, #666);text-decoration:none;">粤公网安备 44140302000277号</a>
    </div>
  </footer>
</body>
</html>
