<body>
  <h1>「图片查看」改版效果（入库/出库一次拍多张）</h1>
  <p class="tip">左边是改动前——拍了两张，点开只看到第一张；右边是改动后——两张都在，能上下翻着看，
  每张右上角都有独立的「保存图片」，保存出来的文件名带「第1张 / 第2张」不会互相覆盖。</p>
